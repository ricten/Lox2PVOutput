[AUTHOR]
NAME=Rico Tengler
EMAIL=rico@cod-lan.de

[PLUGIN]
VERSION=0.5.0
NAME=lox2pvoutput
FOLDER=lox2pvoutput
TITLE=Lox2PVOutput
WEBSITE=https://github.com/ricten/Lox2PVOutput

[AUTOUPDATE]
# true: neue Installationen bekommen automatische Release-Updates (LoxBerry prueft release.cfg im GitHub-Repo, siehe CLAUDE.md)
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/ricten/Lox2PVOutput/main/release.cfg
PRERELEASECFG=

[SYSTEM]
REBOOT=false
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
# true: LoxBerry zeigt die Loglevel-Auswahl in der Plugin-Verwaltung (Installer: SYSTEM.CUSTOM_LOGLEVELS)
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
